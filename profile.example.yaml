# Copy to profile.yaml (git-ignored) and fill in. Used for the cover letter (v2 V6).

# The name signs the letter. The other contacts go above it only with `cover_letter.header: true` in
# config.yaml (for a PDF attachment). Added by cvtailor itself: contacts never go to a model.
contacts:
  name: "Jane Doe"
  email: "jane@example.com"
  phone: ""
  linkedin: "linkedin.com/in/jane-doe"

# What you look for in work, one concrete item each. The letter connects them to what the company says about
# itself and never invents motivation beyond this list. Hooks refer to the ids. Example items:
motivation:
  - id: platform-for-engineers
    text: Build test infrastructure that other engineers rely on every day.
  - id: product-vision
    text: A company with its own product vision that knows what it builds and why.

# Mentioned in one closing sentence only when the vacancy is in another city or country or restricts location.
# Leave out "at my own expense": relocation support stays open for the offer.
relocation:
  base: Berlin
  text: open to relocation
