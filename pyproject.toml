[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cvtailor"
version = "0.0.1"
description = "Tailor a Google Docs resume to a job posting using only verified facts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "google-api-python-client>=2",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1",
    "pypdf>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cvtailor = "cvtailor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cvtailor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
