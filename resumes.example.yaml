# Copy to resumes.yaml (git-ignored). One entry per base resume (usually 2-3, one per target role).
# doc_id is the part of the Google Doc URL between /d/ and /edit.

- id: senior-sdet
  label: Senior SDET                 # used in the copy name: "<label> - <Company> - YYYY-MM-DD"
  doc_id: "<google-doc-id>"
  target_role: Senior SDET, Python test frameworks and developer tooling
  # Edit priority of EXPERIENCE companies (Heading 2, as slugs). A list: these are priority 1 (main edits),
  # later companies get 2, 3, … (at most limits.max_ops_per_past_company edits each). Empty or absent:
  # the two most recent companies are priority 1. A map sets priorities explicitly; 0 = read-only.
  # Older roles with no role in facts.json stay read-only.
  editable_companies: [acme]         # or: {acme: 1, globex: 2, initech: 0}
  # role_map:                        # only if a role heading cannot be matched to facts.json automatically
  #   acme/senior-sdet: acme-senior-sdet

- id: qa-platform
  label: QA Platform Engineer
  doc_id: "<google-doc-id>"
  target_role: QA platform / test infrastructure engineer
  editable_companies: [acme]
