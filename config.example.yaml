# Copy to config.yaml (git-ignored) and fill in.

# Google Drive folder where tailored copies go. A subfolder per company is created inside.
# The id is the last part of the folder URL: https://drive.google.com/drive/folders/<id>
output_folder_id: "<drive-folder-id>"

# Verified fact base built with prompts/build_facts.md
facts_path: docs/facts.json

# Second-model review of each edit: auto (use codex if installed) | codex | none
second_reviewer: auto

# How many times the AI may fix a plan rejected by validators
max_ai_retries: 2

# Second reviewer command (prompt on stdin, runs in an empty temp dir) and timeout.
# Keep the timeout below your agent's shell command timeout (often 120 s).
reviewer_command: [codex, exec, --skip-git-repo-check, -s, read-only, "-"]
reviewer_timeout_s: 100

# Rounds in which reviewer findings (partial / unsupported) go back to the AI for a fix; 0 = only report them
review_fix_rounds: 1

# Scripted AI steps (`cvtailor run`): command template ({model} is replaced), model per step,
# timeout per call, and the time after which `run` stops with `continue` (keep it well below
# your agent's shell timeout minus ai.timeout_s). Defaults shown.
ai:
  command: [claude, -p, --model, "{model}", --output-format, json, --tools, "", --no-session-persistence, --strict-mcp-config,
            --setting-sources, project,
            --system-prompt, "You are one step of a scripted pipeline. Follow the step instructions in the user message. You cannot read or write files: answer with exactly one JSON object and nothing else."]
  models: {extract: sonnet, route: sonnet, analyze: sonnet, tailor: opus}
  default_model: sonnet
  timeout_s: 240
  max_run_seconds: 240

# Validator limits (characters / ratios to the original block). Defaults shown.
limits:
  bullet_max_chars: 220
  bullet_replace_max_ratio: 1.15
  intro_max_ratio: 1.15
  summary_min_ratio: 0.80
  summary_max_ratio: 1.15
  title_max_chars: 80
  skills_line_max_ratio: 1.20
  max_bullets_per_role: 10
  max_ops_per_plan: 12
  total_editable_max_ratio: 1.05
